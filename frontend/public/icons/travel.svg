<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect x="20" y="20" width="160" height="80" fill="#E0F6FF" rx="5"/>
  <!-- Plane body -->
  <ellipse cx="100" cy="60" rx="35" ry="20" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <!-- Wings -->
  <rect x="40" y="55" width="120" height="10" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <!-- Tail -->
  <path d="M130 60 L150 50 L150 70 Z" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <!-- Cockpit -->
  <circle cx="80" cy="60" r="6" fill="#FFD700"/>
  <!-- Ground -->
  <ellipse cx="100" cy="150" rx="40" ry="15" fill="#8B7355"/>
  <!-- Palm tree -->
  <rect x="125" y="130" width="8" height="25" fill="#8B4513"/>
  <circle cx="129" cy="125" r="15" fill="#228B22"/>
</svg>